{# Same-document language link. The relative URL is supplied by conf.py so
   nested pages work on GitHub Pages project sites without a hard-coded host. #}
{% if language_switcher_enabled %}
<a class="i18n-language-switcher" href="{{ language_switch_url }}" lang="{{ 'zh-CN' if language_code == 'en' else 'en' }}">
  {{ language_switch_label }}
</a>
{% endif %}
