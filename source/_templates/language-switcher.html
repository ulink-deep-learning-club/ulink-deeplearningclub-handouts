{# Same-document language menu. Relative URLs keep nested pages working on
   GitHub Pages project sites without a hard-coded host. #}
{% if language_switcher_enabled %}
<details class="i18n-language-menu">
  <summary>{{ language_menu_label }}</summary>
  <ul aria-label="{{ language_menu_label }}">
    <li>
      <span lang="{{ language_current_lang }}" aria-current="page">{{ language_current_label }}</span>
    </li>
    <li>
      <a href="{{ language_switch_url }}" lang="{{ language_switch_lang }}">{{ language_switch_label }}</a>
    </li>
  </ul>
</details>
{% endif %}
